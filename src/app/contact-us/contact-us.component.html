<app-hero-two></app-hero-two>

<!-- Form Section (shared component handles everything) -->
<app-form></app-form>

<!-- Bottom Section -->
<div class="relative bg-black overflow-hidden" style="min-height: 780px;">

  <!-- Map SVG — full width background, anchored to top -->
  <img
    src="/Map.svg"
    alt="Middle East Map"
    class="absolute inset-0 w-full h-full pointer-events-none"
    style="object-fit: cover; object-position: center top;"
  />

  <!-- Art SVG — right side, overlapping the seam between form and map -->
  <img
    src="/Art.svg"
    alt=""
    aria-hidden="true"
    class="absolute pointer-events-none"
    style="
      top: -80px;
      right: -40px;
      width: 45%;
      max-width: 520px;
      opacity: 1;
    "
  />

  <!-- "Design Without Borders" — bottom right -->
  <div class="absolute bottom-0 right-0 p-8 lg:p-14 text-right z-10">
    <h2
      class="font-black text-white leading-none tracking-tight"
      style="font-size: clamp(2.8rem, 6vw, 5.5rem); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;"
    >
      DESIGN<br/>WITHOUT<br/>BORDERS.
    </h2>
    <p class="mt-3 tracking-widest uppercase" style="color: #7A7A7A; font-size: 0.8rem;">
      From Egypt and Dubai to the World.
    </p>
  </div>

</div>
