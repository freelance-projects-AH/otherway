<section class="bg-black pb-6 px-4 sm:px-6 lg:px-8">
  <div class="max-w-7xl mx-auto relative">
    <!-- Header -->
    <div class="relative md:top-16 animate-fade-in">
      <h2 class="mb-12 flex items-start">
        <span class="text-white text-2xl">Our</span>
        <span
          class="text-6xl md:text-8xl lg:text-9xl text-yellow-400 italic font-serif block md:inline"
          >Services</span
        >
      </h2>
    </div>

    <!-- Services Grid -->
    <div
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 relative top-[-12px] shadow-[0_-20px_30px_rgba(0,0,0,0.6)]"
    >
      <div
        *ngFor="let service of services"
        class="group relative bg-zinc-900 rounded-2xl overflow-hidden cursor-pointer shadow-lg transition-all duration-500 hover:shadow-yellow-400/30 hover:scale-105 animate-fade-in"
      >
        <!-- Image / Video -->
        <div class="relative h-96 overflow-hidden">
          <video
            *ngIf="service.isVideo && service.video"
            [src]="service.video"
            autoplay
            loop
            muted
            [attr.playsinline]="true"
            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
          ></video>

          <img
            *ngIf="!service.isVideo && service.image"
            [src]="service.image"
            [alt]="service.title"
            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
          />

          <!-- Overlay -->
          <div
            class="absolute inset-0 bg-black/40 group-hover:bg-black/60 transition-all duration-500"
          ></div>

          <!-- Content فوق الصورة -->
          <div
            class="absolute inset-0 flex flex-col justify-end p-6 text-white z-10"
          >
            <h3 class="text-2xl font-bold mb-2">
              {{ service.title }}
            </h3>

            <p
              class="text-sm text-gray-200 mb-4 opacity-0 group-hover:opacity-100 transition-all duration-500"
            >
              {{ service.description }}
            </p>

            <button
              class="flex items-center gap-2 text-yellow-400 font-semibold text-sm hover:gap-3 transition-all duration-300"
            >
              {{ service.ctaText }}
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17 8l4 4m0 0l-4 4m4-4H3"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
