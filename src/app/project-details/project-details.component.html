<!-- <app-hero-two></app-hero-two> -->
<div class="min-h-screen bg-forth">
  <!-- Loading State -->
  <div
    *ngIf="loading"
    class="flex justify-center flex-col gap-5 items-center py-20"
  >
    <img src="/nav/Logo Black.svg" alt="Loading" class="block h-[60px]" />
    <div
      class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary"
    ></div>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="flex justify-center items-center py-20">
    <div class="text-center px-4">
      <h2 class="text-2xl font-bold text-primary mb-4">Project Not Found</h2>
      <p class="text-gray-600 mb-6 text-6xl">
        The project you're looking for doesn't exist or has been removed.
      </p>
      <button
        (click)="goBack()"
        class="bg-primary text-secondary hover:text-primary px-6 py-3 rounded-lg hover:bg-primary/90 transition-colors"
      >
        Back to Portfolio
      </button>
    </div>
  </div>

  <!-- Project Details -->
  <div *ngIf="project && !loading && !error" class="bg-black  py-8">
    <!-- Header with Back Button -->
    <div class="flex items-center justify-between mb-8 px-4">
      <button
        (click)="goBack()"
        class="flex items-center gap-2 text-secondary hover:text-primary transition-colors"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10 19l-7-7m0 0l7-7m-7 7h18"
          ></path>
        </svg>
        Back to Portfolio
      </button>
    </div>

    <!-- Project Title and Description -->
    <div class="mb-12 px-4">
        <div class="flex flex-wrap gap-2 mb-6">
            <span
              *ngFor="let category of project.categories"
              class="bg-primary/10 text-primary px-3 py-1 rounded-full text-sm"
            >
              {{ category }}
            </span>
          </div>
      <h1 class="text-5xl font-bold text-white mb-6">{{ project.title }}</h1>
      <p class="text-4xl text-secondary leading-relaxed mb-8">
        {{ project.description }}
      </p>
    </div>


    <div *ngIf="project.media && project.media.length > 0" class="mb-12">
      <ng-container *ngFor="let mediaItem of project.media; let i = index">
        <!-- Start new row wrapper for odd indices (1-col rows) or even indices that are divisible by 3 (start of 2-col rows) -->
        <div
          *ngIf="isRowStart(i)"
          [class]="getRowClass(i)"
          class="grid gap-5 auto-rows-auto mb-5"
        >
          <!-- Current item -->
          <div class="w-full">
            <div class="relative overflow-hidden rounded-lg bg-black">
              <ng-container
                *ngIf="
                  getMediaType(mediaItem.file_type) === 'video';
                  else imageBlock
                "
              >
                <video
                  autoplay
                  muted
                  loop
                  playsinline
                  class="w-full h-auto object-cover"
                  [src]="mediaItem.file_link"
                ></video>
              </ng-container>

              <ng-template #imageBlock>
                <img
                  [src]="mediaItem.file_link"
                  [alt]="project.title"
                  class="w-full h-auto object-cover"
                />
              </ng-template>
            </div>
          </div>

          <!-- Second item for 2-column rows -->
          <div *ngIf="isTwoColumnRow(i) && project.media[i + 1]" class="w-full">
            <div class="relative overflow-hidden rounded-lg bg-black">
              <ng-container
                *ngIf="
                  getMediaType(project.media[i + 1].file_type) === 'video';
                  else imageBlock2
                "
              >
                <video
                  autoplay
                  muted
                  loop
                  playsinline
                  class="w-full h-auto object-cover"
                  [src]="project.media[i + 1].file_link"
                ></video>
              </ng-container>

              <ng-template #imageBlock2>
                <img
                  [src]="project.media[i + 1].file_link"
                  [alt]="project.title"
                  class="w-full h-auto object-cover"
                />
              </ng-template>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
    <!-- Additional Project Information -->
    <div class="border-t pt-12">
      <div class="bg-[#111111] rounded-xl px-8 py-6 flex flex-col gap-4 w-full max-w-3xl">
      <!-- Header -->
      <div class="flex items-start justify-between gap-4">
        <h3 class="text-secondary font-bold text-lg leading-tight italic font-serif">{{ name }}</h3>
        <!-- Stars -->
        <div class="flex items-center gap-1 shrink-0">
          <svg
            *ngFor="let star of stars"
            class="w-6 h-6 text-yellow-400 fill-yellow-400"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
        </div>
      </div>

      <!-- Review text -->
      <p class="text-fontSecondary text-sm leading-relaxed ">{{ review }}</p>

      <!-- Tags -->
      <div class="flex items-center gap-2 flex-wrap mt-2">
        <span
          *ngFor="let tag of tags"
          class=" border rounded-lg border-fontSecondary text-fontSecondary text-xs font-semibold tracking-widest uppercase px-3 py-1"
        >
          {{ tag }}
        </span>
      </div>
    </div>
    </div>
  </div>
</div>
